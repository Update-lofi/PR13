<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Песочница Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Моя первая страница на Bootstrap</h1>
        <p>Привет, мир!</p>
    </div>

    <div class="container mt-4">
        <h1>Кнопки</h1>
        <button class="btn btn-primary">Основная</button>
        <button class="btn btn-success">Успех</button>
        <button class="btn btn-outline-danger">Контурная опасность</button>
    </div>

    <div class="container mt-4">
        <h1>Карточка</h1>
        
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Динисламов Ильяс</h5>
                <h6 class="card-subtitle text-muted">Студент</h6>
                <p class="card-text mt-3">Люблю программирование, кофе и путешествия.</p>
                <a href="#" class="btn btn-primary">Подробнее</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
