<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap песочница</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Моя первая Bootstrap страница</h1>
        <p>Привет, мир!</p>
    </div>

    <div class="container mt-4">
        <h1>Кнопки</h1>
        
        <!-- Основные кнопки -->
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>
        
        <hr>
        
        <!-- Кнопки с рамкой -->
        <button class="btn btn-outline-primary">Outline Primary</button>
        <button class="btn btn-outline-danger">Outline Danger</button>
        
        <hr>
        
        <!-- Размеры кнопок -->
        <button class="btn btn-primary btn-lg">Большая</button>
        <button class="btn btn-primary">Обычная</button>
        <button class="btn btn-primary btn-sm">Маленькая</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
